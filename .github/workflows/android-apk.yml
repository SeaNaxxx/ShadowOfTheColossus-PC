name: Android debug APK

on:
  push:
    branches: [android-port]
  pull_request:
    branches: [android-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android-launcher/**/*.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK and host build dependencies
        run: |
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build pkg-config glslang-tools \
            libboost-dev libvulkan-dev robin-map-dev libvulkan-memory-allocator-dev

      - name: Fetch pinned Vulkan headers
        run: |
          # The GPU core targets modern Vulkan-Hpp (maintenance8, KosmicKrisp driver id,
          # unsuffixed divisor structs); Ubuntu 24.04 ships 1.3.x headers. Pin the SDK
          # version build_gpu.sh picks up through VULKAN_SDK.
          curl -fsSL https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/vulkan-sdk-1.4.363.0.tar.gz \
            -o /tmp/vulkan-headers.tar.gz
          echo "4a078be12bef21cfebc09d878b77a63cff9d68f899254a0b00d0e37ef73e7f7e  /tmp/vulkan-headers.tar.gz" | sha256sum --check --status
          mkdir -p /opt/vulkan-headers-1.4.363.0
          tar -xzf /tmp/vulkan-headers.tar.gz -C /opt/vulkan-headers-1.4.363.0 --strip-components=1
          echo "VULKAN_SDK=/opt/vulkan-headers-1.4.363.0" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android-launcher
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shadow-of-the-colossus-android-debug
          path: android-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
